<!-- docs/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ===================== -->
  <!-- Meta & Page Setup -->
  <!-- ===================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food–Body Connection | Login</title>

  <!-- Site Visit Counter (GoatCounter Analytics) -->
  <script data-goatcounter="https://kohoutal.goatcounter.com/count"
      async src="//gc.zgo.at/count.js">
  </script>

  <!-- Styles & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Pinned rather than using the system stack, which resolved to SF Pro on
       an iPhone and Segoe UI on Windows and so never matched between them.
       display=swap shows the fallback immediately rather than blank text if
       the font is slow or unreachable. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/images/background_iphone.png">
  <link rel="apple-touch-icon" href="static/apple-touch-icon.png">
</head>

<body>
  <main class="container">

    <!-- ===================== -->
    <!-- Project Card Wrapper -->
    <!-- ===================== -->
    <div class="project-card">

      <!-- Application Title -->
      <h1>Food–Body Connection</h1>

      <!-- Short product description -->
      <p class="tagline">
        Log foods. Track symptoms. Discover patterns.
      </p>

      <!-- ===================== -->
      <!-- Authentication Tabs -->
      <!-- ===================== -->
      <!-- Controlled by js/tabs.js -->
      <div class="tabs">
        <button class="tab active" data-tab="login">Log in</button>
        <button class="tab" data-tab="register">Register</button>
      </div>

      <!-- ========================================================= -->
      <!-- ======================= LOGIN FORM ====================== -->
      <!-- ========================================================= -->
      <!-- Handles existing user authentication (js/main.js) -->
      <form id="login-form" class="form active">

        <!-- Email input -->
        <label>
          Email
          <input type="email" id="login_email" required />
        </label>

        <!-- Password input -->
        <label>
          Password
          <input type="password" id="login_password" required />
        </label>

        <!-- Submit button -->
        <button type="submit" class="primary">Log in</button>

        <!-- Forgot password link -->
        <p style="text-align:center; margin-top: 0.5rem;">
          <a href="#" id="forgot-password-link" style="font-size:0.85em;">Forgot password?</a>
        </p>
      </form>

      <!-- Forgot password inline form (hidden by default) -->
      <form id="forgot-form" class="form" style="display:none;">
        <p style="margin-bottom:0.75rem; font-size:0.9em;">Enter your email and we'll send you a reset link.</p>
        <label>
          Email
          <input type="email" id="forgot_email" required />
        </label>
        <button type="submit" class="primary">Send reset link</button>
        <p style="text-align:center; margin-top:0.5rem;">
          <a href="#" id="back-to-login-link" style="font-size:0.85em;">Back to login</a>
        </p>
      </form>

      <!-- ========================================================= -->
      <!-- ===================== REGISTRATION FORM ================= -->
      <!-- ========================================================= -->
      <!-- Handles new account creation (js/main.js) -->
      <form id="register-form" class="form">

        <!-- Email input -->
        <label>
          Email
          <input type="email" id="registration_email" required />
        </label>

        <!-- Password input -->
        <label>
          Password
          <input type="password" id="registration_password" required />
        </label>

        <!-- Submit button -->
        <button type="submit" class="primary">Create account</button>
      </form>

      <!-- ===================== -->
      <!-- Status Messages -->
      <!-- ===================== -->
      <!-- Populated dynamically by main.js -->
      <p id="login-success" class="success"></p>
      <p id="login-error" class="error"></p>
      <p id="registration-success" class="success"></p>
      <p id="registration-error" class="error"></p>

      <!-- ===================== -->
      <!-- Footer Links -->
      <!-- ===================== -->
      <div class="project-footnote">
        <!-- Developer / project page -->
        <a href="https://alkohout.github.io/projects/food_body_connection/">
          Dev
        </a>
        ·
        <!-- API documentation.
             Keep this host in step with API_URL in docs/js/api.js — it sat on
             the old 54.253.73.35 address for a while after the box moved. -->
        <a href="https://foodbodyconnection.159.13.61.101.nip.io/docs" target="_blank">
          API
        </a>
      </div>

    </div>
  </main>

  <!-- ===================== -->
  <!-- JavaScript Files -->
  <!-- ===================== -->

  <!-- Main authentication logic -->
  <script type="module" src="js/main.js"></script>

  <!-- Tab switching functionality -->
  <script src="js/tabs.js"></script>

</body>
</html>
