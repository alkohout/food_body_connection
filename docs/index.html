<!-- docs/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food–Body Connection | Login</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="static/favicon.png">
</head>
<body>
  <main class="container">
    <h1>Food–Body Connection</h1>
    <p class="tagline">Log foods. Track symptoms. Discover patterns.</p>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="login">Log in</button>
      <button class="tab" data-tab="register">Register</button>
    </div>

    <!-- Login -->
    <form id="login-form" class="form active">
      <label>
        Email
        <input type="email" id="login_email" required />
      </label>

      <label>
        Password
        <input type="password" id="login_password" required />
      </label>

      <button type="submit" class="primary">Log in</button>
    </form>

    <!-- Register -->
    <form id="register-form" class="form">
      <label>
        Email
        <input type="email" id="registration_email" required />
      </label>

      <label>
        Password
        <input type="password" id="registration_password" required />
      </label>

      <button type="submit" class="primary">Create account</button>
    </form>

    <p id="login-success" class="success"></p>
    <p id="login-error" class="error"></p>
    <p id="registration-success" class="success"></p>
    <p id="registration-error" class="error"></p>

    <div class="actions">
      <a class="button secondary"
         href="https://alkohout.github.io/projects/food_body_connection/">
        View project overview
      </a>
    </div>

    <div class="actions">
      <a class="button secondary"
         href="https://foodbodyconnection.54.253.73.35.nip.io/docs"
         target="_blank">
        API Documentation (Swagger)
      </a>
    </div>
  </main>
ķ
  <script type="module" src="js/main.js"></script>
  <script src="js/tabs.js"></script>
</body>
</html>
