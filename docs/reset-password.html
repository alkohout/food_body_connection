<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food–Body Connection | Reset Password</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/images/background_iphone.png">
</head>
<body>
  <main class="container">
    <div class="project-card">
      <h1>Food–Body Connection</h1>
      <p class="tagline">Reset your password</p>

      <form id="reset-form" class="form active">
        <label>
          New password
          <input type="password" id="new_password" required minlength="8" />
        </label>
        <label>
          Confirm password
          <input type="password" id="confirm_password" required minlength="8" />
        </label>
        <button type="submit" class="primary">Set new password</button>
      </form>

      <p id="reset-success" class="success"></p>
      <p id="reset-error" class="error"></p>
    </div>
  </main>

  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
