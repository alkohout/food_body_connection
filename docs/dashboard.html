<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food–Body Connection | Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">

    <header class="dashboard-header">
      <h1>Food–Body Connection</h1>
      <p id="user-email" class="subtle"></p>
      <button id="logout-btn" class="secondary">Log out</button>
    </header>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="allergen">Log Allergen</button>
      <button class="tab" data-tab="symptom">Log Symptom</button>
      <button class="tab" data-tab="analysis">Analysis</button>
    </div>

    <!-- Allergen tab -->
    <form id="allergen-form" class="form active">
      <h2>Log allergen consumed</h2>

      <label>
        Allergen
        <input type="text" id="allergen-input" autocomplete="off" />
        <input type="hidden" id="allergen-id" />
        <ul id="allergen-suggestions" class="suggestions"></ul>
      </label>

      <label>
        Date & time
        <input type="datetime-local" id="allergen-date" required />
      </label>

      <label>
        Quantity
        <input type="number" step="0.01" id="allergen-quantity" />
      </label>

      <label>
        Unit
        <select id="allergen-unit">
          <option value="">—</option>
        </select>
      </label>

      <button type="submit" class="primary">Log allergen</button>

      <p id="log-success" class="success"></p>
      <p id="log-error" class="error"></p>
    </form>

    <!-- Symptom tab -->
    <form id="symptom-form" class="form">
      <h2>Log symptom</h2>

      <label>
        Symptom 
        <input type="text" id="symptom-input" autocomplete="off" />
        <input type="hidden" id="symptom-id" />
        <ul id="symptom-suggestions" class="suggestions"></ul>
      </label>


      <label>
        Date & time
        <input type="datetime-local" id="symptom-date" />
      </label>

      <label>
        Intensity 
        <input type="range" id="symptom-intensity" min="0" max="3" />
      </label>

      <button type="submit" class="primary">Log symptom</button>

      <p id="symptom-success" class="success"></p>
      <p id="symptom-error" class="error"></p>
    </form>

    <!-- Analysis tab -->

    <form id="analysis-form" class="form">
        <p>Explore your logged data to identify potential food–symptom relationships.</p>

        <section class="analysis-section">
        <!-- ===================== -->
        <!-- Summary statistics -->
        <!-- ===================== -->
            <h3>Summary Statistics</h3>

            <div class="analysis-grid">
            <div class="stat-card">
                <h4>Total entries</h4>
                <div id="stat-total-entries">—</div>
            </div>

            <div class="stat-card">
                <h4>Days tracked</h4>
                <div id="stat-days">—</div>
            </div>

            </div>
        <!-- ===================== -->
        <!-- Bar plot - Symptom Frequency -->
        <!-- ===================== -->

            <h3>Bar Plot</h3>
            <img id="analysis-plot" src="" alt="Analysis Plot" style="width:90%; height:auto;" />

            <label>Allergen:</label>
            <input type="text" id="allergen-plot-input" autocomplete="off" />
            <input type="hidden" id="allergen-plot-id" />
            <ul id="allergen-plot-suggestions" class="suggestions"></ul>
            <label>Symptom:</label>
            <input type="text" id="symptom-plot-input" autocomplete="off" />
            <input type="hidden" id="symptom-plot-id" />
            <ul id="symptom-plot-suggestions" class="suggestions"></ul>
            <button type="button" id="update-plot-btn">Generate Plot</button>
        </section>



        <!-- ===================== -->
        <!-- Symptom distribution -->
        <!-- ===================== -->
        <section class="analysis-section">
            <h3>Symptom Distribution</h3>

            <label>
            Group by
            <select id="symptom-groupby">
                <option value="symptom">Symptom</option>
                <option value="severity">Severity</option>
                <option value="time_of_day">Time of day</option>
            </select>
            </label>

            <div class="plot-container" id="symptom-distribution-plot">
            <!-- bar / histogram goes here -->
            </div>
        </section>

        <!-- ===================== -->
        <!-- Dose-response -->
        <!-- ===================== -->
        <section class="analysis-section">
            <h3>Dose–Response</h3>

            <label>
            Unit
            <select id="dose-unit">
                <option value="g">grams</option>
                <option value="ml">ml</option>
                <option value="serving">servings</option>
            </select>
            </label>

            <div class="plot-container" id="dose-response-plot">
            <!-- scatter / smooth curve -->
            </div>
        </section>

        <!-- ===================== -->
        <!-- Time lag analysis -->
        <!-- ===================== -->
        <section class="analysis-section">
            <h3>Time Lag</h3>

            <label>
            Max lag (hours)
            <input type="number" id="max-lag" value="24" min="1" max="72">
            </label>

            <div class="plot-container" id="lag-plot">
            <!-- lag histogram / density -->
            </div>
        </section>

        <!-- ===================== -->
        <!-- Notes / interpretation -->
        <!-- ===================== -->
        <section class="analysis-section">
            <h3>Notes</h3>
            <textarea
            id="analysis-notes"
            placeholder="Observations, hypotheses, confounders…"
            rows="4"
            ></textarea>
        </section>

    </form>


  </main>

  <script src="js/tabs.js"></script>
  <script type="module" src="js/dashboard.js"></script>

</body>
</html>
