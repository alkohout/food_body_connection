<!-- docs/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food–Body Connection | Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Food–Body Connection Dashboard</h1>
    <div class="user-info">
      Logged in as: <span id="user-email"></span>
      <button id="logout-btn">Logout</button>
    </div>
  </header>

  <main class="container">
    <!-- Log Allergen / Symptom Section -->
    <section id="log-allergen">
      <h2>Log an allergen</h2>
      <form id="log-form">

        <label for="allergen-date">Date & Time</label>
        <input
        type="datetime-local"
        id="allergen-date"
        value=""
        />

        <label for="allergen-input">Allergen</label>
        <input
        type="text"
        id="allergen-input"
        placeholder="Start typing (e.g. milk)"
        autocomplete="off"
        />
        <input type="hidden" id="allergen-id" />

        <ul id="allergen-suggestions" class="suggestions"></ul>

        <button type="submit">Log</button>

      </form>

      <p id="log-success" class="success"></p>
      <p id="log-error" class="error"></p>

      <!-- Last 5 entries will be displayed here -->
      <div id="recent-entries">
        <h3>Recent Entries</h3>
        <ul id="entries-list"></ul>
      </div>
    </section>

    <!-- Stats / Insights Section -->
    <section id="stats">
      <h2>Stats & Insights</h2>
      <p>Charts and insights will appear here.</p>
      <!-- Placeholder for charts / graphs -->
      <div id="charts"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Food–Body Connection</p>
  </footer>

  <!-- Dashboard JS -->
  <script type="module" src="js/dashboard.js"></script>
  <script>
    // Logout functionality
    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem("access_token");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
