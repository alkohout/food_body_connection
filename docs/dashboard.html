<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food–Body Connection | Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">

    <header class="dashboard-header">
      <h1>Food–Body Connection</h1>
      <p id="user-email" class="subtle"></p>
    </header>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="allergen">Log Allergen</button>
      <button class="tab" data-tab="symptom">Log Symptom</button>
      <!-- future -->
      <!-- <button class="tab" data-tab="analysis">Analysis</button> -->
    </div>

    <!-- Allergen tab -->
    <form id="allergen" class="form active">
      <h2>Log allergen consumed</h2>

      <label>
        Allergen
        <input type="text" id="allergen-input" autocomplete="off" />
        <input type="hidden" id="allergen-id" />
        <ul id="allergen-suggestions" class="suggestions"></ul>
      </label>

      <label>
        Date & time
        <input type="datetime-local" id="allergen-date" required />
      </label>

      <label>
        Quantity
        <input type="number" step="0.01" id="allergen-quantity" />
      </label>

      <label>
        Unit
        <select id="allergen-unit">
          <option value="">—</option>
        </select>
      </label>

      <button type="submit" class="primary">Log allergen</button>

      <p id="log-success" class="success"></p>
      <p id="log-error" class="error"></p>
    </form>

    <!-- Symptom tab -->
    <form id="symptom" class="form">
      <h2>Log symptom</h2>

      <label>
        Symptom
        <input type="text" id="symptom-input" />
      </label>

      <label>
        Date & time
        <input type="datetime-local" id="symptom-date" />
      </label>

      <label>
        Severity
        <input type="range" id="symptom-severity" min="1" max="10" />
      </label>

      <label>
        Notes
        <textarea id="symptom-notes"></textarea>
      </label>

      <button type="submit" class="primary">Log symptom</button>

      <p id="symptom-success" class="success"></p>
      <p id="symptom-error" class="error"></p>
    </form>

  </main>

  <script src="js/tabs.js"></script>
  <script type="module" src="js/dashboard.js"></script>

</body>
</html>
