<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Allergen Log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <h1>Allergen log</h1>
    <p class="tagline">Track food allergens safely and accurately</p>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active">Allergen</button>
      <button class="tab">Stats</button>
    </div>

    <!-- Allergen form -->
    <form id="allergen-form" class="form active">
      <fieldset>
        <legend>Allergen</legend>

        <label for="allergen-select">Select allergen</label>
        <select id="allergen-select" required autofocus>
          <option value="">Select an allergen...</option>
        </select>

        <p class="helper-text">
          Can’t find the allergen you’re looking for? Add a new one below.
        </p>

        <div class="inline-add">
          <input
            type="text"
            id="new-allergen-name"
            placeholder="New allergen name"
          />
          <button
            type="button"
            id="add-allergen-btn"
            class="secondary"
          >
            Add
          </button>
        </div>

        <input type="hidden" id="allergen-id" />
      </fieldset>

      <fieldset>
        <legend>Details</legend>

        <label for="allergen-date">Date &amp; time</label>
        <input type="datetime-local" id="allergen-date" required />

        <label for="allergen-quantity">Quantity</label>
        <input type="number" step="0.01" id="allergen-quantity" />

        <label for="allergen-unit">Unit</label>
        <select id="allergen-unit">
          <option value="">—</option>
        </select>
      </fieldset>

      <button type="submit" class="primary">
        Log allergen
      </button>

      <p id="log-success" class="success" aria-live="polite"></p>
      <p id="log-error" class="error" aria-live="assertive"></p>
    </form>
  </div>
</body>
</html>
