# /etc/nginx/sites-available/foodbodyconnection
#
# Replace YOUR_ORACLE_IP with your Oracle Cloud public IP.
# After certbot runs it will rewrite this file to add HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name foodbodyconnection.YOUR_ORACLE_IP.nip.io;

    # Proxy all traffic to the FastAPI app
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow larger request bodies (for future file uploads)
        client_max_body_size 10M;

        # Timeouts for slow analysis endpoints
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
